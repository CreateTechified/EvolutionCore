name: Java CI with Gradle
on:
  push:
    branches: ["1.20.1", "1.21.1"]
  pull_request:
    branches: ["1.20.1", "1.21.1"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
      - uses: burrunan/gradle-cache-action@v3
        name: Build EvolutionCore
        with:
          job-id: jdk21
          arguments: build
          gradle-version: wrapper
          concurrent-save: true
      - name: Get Mod Version
        id: mod_version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "version=${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Release
        if: github.event_name == 'push' && contains(github.ref, 'refs/heads/1.20.1')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: v${{ steps.mod_version.outputs.version }}
          name: ${{ steps.mod_version.outputs.version }}
          draft: false
          prerelease: ${{ steps.mod_version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}