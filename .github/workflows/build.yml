name: Java CI with Gradle
on:
  push:
    branches: ["1.20.1", "1.21.1"]
  pull_request:
    branches: ["1.20.1", "1.21.1"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
      - uses: burrunan/gradle-cache-action@v3
        name: Build EvolutionCore
        with:
          job-id: jdk21
          arguments: build
          gradle-version: wrapper
          concurrent: true
      - name: Process Version and Rename Jar
        id: mod_version
        run: |
          MC_VERSION="${GITHUB_REF_NAME}"
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            for file in build/libs/*.jar; do
              if [ -f "$file" ]; then
                base="${file%.jar}"
                mv "$file" "${base}-${SHORT_SHA}.jar"
              fi
            done
            echo "tag_name=latest-${MC_VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_name=${MC_VERSION}-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${MC_VERSION}-${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release_name=${MC_VERSION}-${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            if [[ "$MC_VERSION" == "1.20.1" ]]; then
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Clean Existing Release Assets
        if: github.event_name == 'push' && startsWith(steps.mod_version.outputs.tag_name, 'latest-')
        run: |
          TAG="${{ steps.mod_version.outputs.tag_name }}"
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          for asset in $ASSETS; do
            echo "Deleting asset: $asset"
            gh release delete-asset "$TAG" "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: ${{ steps.mod_version.outputs.tag_name }}
          name: ${{ steps.mod_version.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.mod_version.outputs.prerelease }}
          make_latest: ${{ steps.mod_version.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
